name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.3.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: version
        run: |
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Jellyfin.Plugin.Kindle.csproj | head -1)
          REQUESTED="${{ github.event.inputs.version || github.ref_name }}"
          if [ "$CSPROJ_VERSION" != "$REQUESTED" ]; then
            echo "::error::Tag/input is $REQUESTED but the csproj builds $CSPROJ_VERSION."
            echo "::error::Bump <Version>, <AssemblyVersion> and <FileVersion> together, then tag."
            exit 1
          fi
          echo "version=$CSPROJ_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package
        id: package
        run: bash scripts/package.sh

      - name: Update manifest.json
        run: |
          python3 scripts/update-manifest.py \
            --version "${{ steps.package.outputs.version }}" \
            --checksum "${{ steps.package.outputs.checksum }}" \
            --source-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.package.outputs.version }}/Jellyfin.Plugin.Kindle_${{ steps.package.outputs.version }}.zip" \
            --changelog "See the release notes for ${{ steps.package.outputs.version }}." \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Strict now: the manifest must publish exactly what was just built. This is the
      # last gate before the artifact becomes installable.
      - name: Verify published identity
        run: python3 scripts/verify_version.py --strict

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: publish ${{ steps.package.outputs.version }}"
          git push origin HEAD:main

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: ${{ steps.package.outputs.version }}
          files: artifacts/*.zip
          generate_release_notes: true
