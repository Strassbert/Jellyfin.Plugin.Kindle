name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Runs first: a version mismatch between the assembly and manifest.json makes
      # the plugin impossible to uninstall, and that must never reach a release.
      - name: Verify plugin identity
        run: python3 scripts/verify_version.py

      - name: Check client script syntax
        run: node --check Web/kindleButton.js

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: artifacts/*.zip
          if-no-files-found: error
